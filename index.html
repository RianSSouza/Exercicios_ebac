<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
    <style>
        body {
            background-color: #ccc;
        }

        .campo {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .formulario {
            width: 320px;
            padding: 8px;
            background-color: #fff;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="campo">
        <div class="formulario">
            <form id="form-aluno">
                <div class="mb-3">
                    <label for="" class="form-label">Nome:</label>
                    <input type="text" class="form-control" id="form-nome">
                </div>
                <div class="mb-3">
                    <label for="" class="form-label">Nota:</label>
                    <div class="d-flex">
                        <input type="number" class="form-control w-25 me-5" id="form-nota">
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>
                </div>
            </form>
            <div class="d-flex justify-content-center m-3 gap-2">
                <button class="btn btn-secondary" id="btn-mostrar">Mostrar Alunos</button>
                <button class="btn btn-success" id="btn-aprovados">Aprovados</button>
                <button class="btn btn-danger" id="btn-reprovados">Reprovados</button>
            </div>
        </div>
    </div>
    <div class="modal" id="mostra-alunos" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-body">
                    <p id="lista-alunos"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="botao">Ok</button> 
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./dist/main.js"></script>
</body>
</html>
